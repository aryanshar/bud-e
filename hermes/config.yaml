# Merge into ~/.hermes/config.yaml.
#
# Hermes is no longer on the voice path. Bud-E's agent tier talks to oMLX
# directly; Hermes only runs background jobs handed to it by the `delegate`
# tool, where a slow start costs nothing because nobody is waiting.

model:
  provider: custom
  default: Qwen3.8-27B-MLX-4bit        # exactly as `bud-e doctor` lists it
  base_url: http://localhost:8250/v1   # oMLX (port from ~/.omlx/settings.json)
  # api_key: set to oMLX's key, or enable localhost bypass in its admin panel
  context_length: 64000                # Hermes rejects agent sessions below 64k
  max_tokens: 4096                     # background jobs may think; no one is waiting
  extra_body:
    chat_template_kwargs:
      enable_thinking: true            # depth is the point of delegating

agent:
  max_turns: 12                        # longer leash than voice, still capped

compression:
  threshold: 0.7
