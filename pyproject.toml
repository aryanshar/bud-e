[project]
name = "bud-e"
version = "0.3.0"
description = "A local voice assistant that runs on your own machine: mic, Whisper, any OpenAI-compatible local model, Kokoro."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.60",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/aryanshar/bud-e"
Issues = "https://github.com/aryanshar/bud-e/issues"

[project.optional-dependencies]
# Everything needed to talk to it out loud.
voice = [
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "torch>=2.4",
    "silero-vad>=5.1",
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
    "faster-whisper>=1.1; sys_platform != 'darwin'",
    "kokoro>=0.9",
    # preshed 3.0.14 breaks loading spaCy's English model, which Kokoro
    # needs ("OverflowError: Python int too large"). Lift once fixed.
    "preshed<3.0.14",
    # Kokoro's text front end downloads a spaCy model with pip on first run,
    # and uv-made venvs don't include pip.
    "pip",
]
# Optional: only answer your voice (ECAPA speaker verification).
speaker = [
    "speechbrain>=1.0",
]
dev = [
    "pytest>=8",
]

[project.scripts]
bud-e = "bud_e.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bud_e"]

[tool.pytest.ini_options]
testpaths = ["tests"]
